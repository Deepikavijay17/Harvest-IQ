                      {govData?.summary?.predicted_state_yield_lakh_mt || '148.2'} Lakh MT
                    </div>
                    <span class="text-[11px] text-emerald-600 font-semibold">38 Districts Samba Crop Model</span>
                  </div>

                  <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-500">Procurement Budget</span>
                    <div class="text-2xl font-black text-slate-900 mt-1">
                      ₹{govData?.summary?.estimated_procurement_budget_cr?.toLocaleString() || '26,450'} Cr
                    </div>
                    <span class="text-[11px] text-slate-500 font-semibold">TNCSC / Direct Purchase Centers</span>
                  </div>

                  <div class="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-500">State Warehouse Util.</span>
                    <div class="text-2xl font-black text-amber-600 mt-1">
                      {govData?.summary?.state_utilization_pct || '78.4'}%
                    </div>
                    <span class="text-[11px] text-slate-500 font-semibold">Capacity: {govData?.summary?.state_godown_capacity_lakh_mt || '98.5'} Lakh MT</span>
                  </div>

                  <div class="bg-white p-5 rounded-2xl border border-rose-200 bg-rose-50/40 shadow-sm">
                    <span class="text-xs font-bold uppercase tracking-wider text-rose-700">Overflow Risk Badge</span>
                    <div class="text-2xl font-black text-rose-700 mt-1">
                      {govData?.summary?.overflow_critical_count || 4} Districts Critical
                    </div>
                    <span class="text-[11px] text-rose-600 font-bold">Stock &gt; 85% of Godown Space</span>
                  </div>
                </div>

                {/* WHAT-IF SCENARIO SIMULATOR */}
                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                  <div class="flex flex-col sm:flex-row justify-between sm:items-center mb-4 gap-2">
                    <div>
                      <h3 class="text-lg font-bold text-slate-900 flex items-center space-x-2">
                        <span>🎛️</span>
                        <span>{t.whatIfTitle}</span>
                      </h3>
                      <p class="text-xs text-slate-500 mt-0.5">{t.whatIfDesc}</p>
                    </div>
                    <span class="px-3 py-1 rounded-full text-xs font-black bg-emerald-100 text-emerald-800">
                      Procurement Target: {procureSlider}%
                    </span>
                  </div>

                  <div class="mb-6">
                    <input
                      type="range"
                      min="15"
                      max="60"
                      value={procureSlider}
                      onChange={(e) => runSimulation(e.target.value)}
                      class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-emerald-600"
                    />
                    <div class="flex justify-between text-[11px] text-slate-400 font-bold mt-1">
                      <span>15% (Minimum)</span>
                      <span>25% (Baseline Target)</span>
                      <span>40% (Aggressive MSP drive)</span>
                      <span>60% (Full buffer drive)</span>
                    </div>
                  </div>

                  {simResult && (
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs">
                      <div>
                        <span class="text-slate-500 block">Extra Grain Procured:</span>
                        <span class="text-base font-black text-slate-900">
                          {simResult.extra_procurement_metric_tonnes?.toLocaleString()} Tonnes
                        </span>
                      </div>
                      <div>
                        <span class="text-slate-500 block">Extra Budget Needed:</span>
                        <span class="text-base font-black text-slate-900">
                          ₹{simResult.extra_budget_needed_cr?.toLocaleString()} Crores
                        </span>
                      </div>
                      <div>
                        <span class="text-slate-500 block">Storage Deficit Warning:</span>
                        <span class="text-base font-black text-rose-700">
                          {simResult.extra_storage_deficit_tonnes?.toLocaleString()} Tonnes Shortfall
                        </span>
                      </div>
                      <div class="sm:col-span-3 pt-2 border-t border-slate-200 text-emerald-900 font-semibold">
                        💡 Directive: {simResult.recommendation}
                      </div>
                    </div>
                  )}
                </div>

                {/* 38 DISTRICTS MAP / GRID VIEW */}
                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                  <div class="flex flex-col sm:flex-row justify-between sm:items-center mb-6 gap-3">
                    <div>
                      <h3 class="text-lg font-bold text-slate-900 flex items-center space-x-2">
                        <span>🗺️</span>
                        <span>{t.govtechTitle}</span>
                      </h3>
                      <p class="text-xs text-slate-500 mt-0.5">{t.govtechDesc}</p>
                    </div>

                    <div class="flex space-x-2">
                      {['All', 'Cauvery Delta', 'Western Zone', 'Southern Zone', 'Northern Zone'].map((z) => (
                        <button
                          key={z}
                          onClick={() => setSelectedGovZone(z)}
                          class={`px-3 py-1 rounded-lg text-xs font-bold transition ${selectedGovZone === z ? 'bg-slate-900 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                        >
                          {z}
                        </button>
                      ))}
                    </div>
                  </div>

                  {/* Legend */}
                  <div class="flex items-center space-x-4 mb-4 text-xs font-semibold text-slate-600">
                    <span class="flex items-center space-x-1.5">
                      <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
                      <span>Safe (&lt; 70%)</span>
                    </span>
                    <span class="flex items-center space-x-1.5">
                      <span class="w-3 h-3 rounded-full bg-amber-500"></span>
                      <span>Caution (70 - 84%)</span>
                    </span>
                    <span class="flex items-center space-x-1.5">
                      <span class="w-3 h-3 rounded-full bg-rose-500 animate-pulse"></span>
                      <span>Overflow Alert (&ge; 85%)</span>
                    </span>
                  </div>

                  {/* District Cards Grid */}
                  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                    {govData?.all_districts
                      ?.filter(d => selectedGovZone === 'All' || d.zone === selectedGovZone)
                      ?.map((d) => {
                        let colorClass = 'border-emerald-300 bg-emerald-50/20';
                        let pillClass = 'bg-emerald-100 text-emerald-800';
                        if (d.utilization_pct >= 85) {
                          colorClass = 'border-rose-300 bg-rose-50/40';
                          pillClass = 'bg-rose-100 text-rose-800 animate-pulse';
                        } else if (d.utilization_pct >= 70) {
                          colorClass = 'border-amber-300 bg-amber-50/30';
                          pillClass = 'bg-amber-100 text-amber-800';
                        }

                        return (
                          <div key={d.district_code} class={`p-4 rounded-xl border ${colorClass} transition hover:shadow-md`}>
                            <div class="flex justify-between items-start mb-2">
                              <div>
                                <h5 class="font-extrabold text-slate-900 text-sm">{d.district_name}</h5>
                                <span class="text-[10px] text-slate-400 font-semibold">{d.zone}</span>
                              </div>
                              <span class={`px-2 py-0.5 rounded text-xs font-black ${pillClass}`}>
                                {d.utilization_pct}%
                              </span>
                            </div>

                            <div class="text-[11px] space-y-1 text-slate-600 mt-2">
                              <div class="flex justify-between">
                                <span>Cropped:</span>
                                <span class="font-semibold text-slate-800">{d.cropped_area_ha?.toLocaleString()} ha</span>
                              </div>
                              <div class="flex justify-between">
                                <span>Yield Est.:</span>
                                <span class="font-semibold text-slate-800">{d.predicted_yield_mt?.toLocaleString()} MT</span>
                              </div>
                              <div class="flex justify-between">
                                <span>Godown Stock:</span>
                                <span class="font-bold text-slate-900">{d.current_stock_mt?.toLocaleString()} / {d.godown_capacity_mt?.toLocaleString()} MT</span>
                              </div>
                            </div>

                            {d.overflow_risk && (
                              <div class="mt-2.5 px-2 py-1 bg-rose-100/90 text-rose-800 text-[10px] font-bold rounded flex items-center space-x-1">
                                <span>⚠️</span>
                                <span>Overflow risk! Reroute grain.</span>
                              </div>
                            )}
                          </div>
                        );
                      })}
                  </div>
                </div>
              </div>
            )}

            {/* TAB 3: MARKET FORECASTING & ANALYTICS */}
            {tab === 'forecast' && (
              <div class="space-y-8">
                <div class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm">
                  <div class="flex flex-col sm:flex-row justify-between sm:items-center mb-6 gap-3">
                    <div>
                      <h3 class="text-xl font-bold text-slate-900 flex items-center space-x-2">
                        <span>📈</span>
                        <span>12-Month Agmarknet Price Forecast (Tamil Nadu)</span>
                      </h3>
                      <p class="text-xs text-slate-500 mt-1">
                        Trained on seasonal Agmarknet arrivals with historical confidence bands and verified accuracy.
                      </p>
                    </div>

                    <div class="flex items-center space-x-2">
                      <span class="text-xs font-bold text-slate-600">Select Commodity:</span>
                      <select
                        value={forecastCrop}
                        onChange={(e) => setForecastCrop(e.target.value)}
                        class="px-3 py-1.5 rounded-lg border border-slate-300 text-xs font-bold"
                      >
                        <option value="Rice">Rice (Samba ADT 37)</option>
                        <option value="Groundnut">Groundnut (TMV 7)</option>
                        <option value="Cotton">Cotton (Long Staple)</option>
                        <option value="Sugarcane">Sugarcane (Co 86032)</option>
                      </select>
                    </div>
                  </div>

                  {/* Chart Canvas */}
                  <div class="h-80 w-full mb-6">
                    <canvas ref={chartRef}></canvas>
                  </div>

                  {/* Model Performance / Trust Metrics */}
                  {forecastData?.model_performance && (
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 p-4 bg-slate-50 rounded-xl border border-slate-200 text-xs">
                      <div>
                        <span class="text-slate-500 block font-medium">Historical Mean Absolute Error (MAE):</span>
                        <span class="text-sm font-black text-emerald-800">{forecastData.model_performance.historical_mean_absolute_error}</span>
                      </div>
                      <div>
                        <span class="text-slate-500 block font-medium">Overall Model Reliability:</span>
                        <span class="text-sm font-black text-slate-900">{forecastData.model_performance.model_confidence_score}</span>
                      </div>
                      <div>
                        <span class="text-slate-500 block font-medium">How far off has it been in past years?</span>
                        <span class="text-xs text-slate-700 font-semibold">{forecastData.model_performance.trust_metric}</span>
                      </div>
                    </div>
                  )}
                </div>
              </div>
            )}

          </main>

          {/* FOOTER */}
          <footer class="bg-white border-t border-slate-200 py-6 text-center text-xs text-slate-500">
            <div class="max-w-7xl mx-auto px-4 flex flex-col sm:flex-row justify-between items-center gap-2">
              <div>
                <span class="font-bold text-slate-800">HarvestIQ Prototype</span> — Agriculture & Market Intelligence for Tamil Nadu.
              </div>
              <div class="flex space-x-4">
                <span>Agmarknet Verified</span>
                <span>IMD Chennai Agro-Met</span>
                <span>TNAU Agritech Grounded</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
